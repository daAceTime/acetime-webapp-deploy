<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AceTime</title>
    <base href="/" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- App styles -->
    <link href="css/acetime.css" rel="stylesheet" />
    <link href="AceTime.styles.css" rel="stylesheet" />

    <!-- PWA -->
    <link rel="icon" type="image/png" href="Ace-favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
</head>

<body>
    <div id="app">
        <div class="ac-loader">
            <svg class="loading-progress" viewBox="0 0 100 100" aria-hidden="true">
                <circle class="loading-progress-bg" cx="50" cy="50" r="44"></circle>
                <circle class="loading-progress-fg" cx="50" cy="50" r="44"></circle>
            </svg>
            <div class="loading-progress-text">Wird geladen…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <div class="ac-error-ui__content">
            <div class="ac-error-ui__title">Ups – etwas ist schiefgelaufen.</div>
            <div class="ac-error-ui__text">
                Bitte lade die Seite neu. Wenn das öfter passiert, könnte es am Cache oder Service Worker liegen.
            </div>
        </div>

        <a href="" class="reload">Neu laden</a>
        <a class="dismiss" title="Schließen" aria-label="Schließen">🗙</a>
    </div>

    <script>
        (function () {
            const theme = localStorage.getItem("acetime-theme") || "light";
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            const useDark = theme === "dark" || (theme === "system" && prefersDark);

            if (useDark) {
                document.body.classList.add("ac-dark");
            }
        })();
    </script>

    <script src="js/acetimeTheme.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>
</body>
</html>
